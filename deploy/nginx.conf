limit_req_zone $binary_remote_addr zone=pc_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=pc_api:1m rate=8r/s;
server {
    listen 80;
    server_name primecloud.pigboss.xyz;
    access_log off;
    client_max_body_size 8k;
    limit_req_status 429;
    location = /auth/start {
        limit_req zone=pc_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8791;
    }
    location / {
        limit_req zone=pc_api burst=16 nodelay;
        proxy_pass http://127.0.0.1:8791;
    }
}

[package]
name = "primecloud"
version = "0.1.0"
edition = "2021"

[dependencies]
native-windows-gui = { version = "1.0", features = ["all"] }
native-windows-derive = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
semver = "1"
self-replace = "1"
open = "5"
windows = {version="0.58", features=["Foundation", "Media_Core", "Media_Playback"]}
tempfile = "3"
keyring = {version="3", features=["windows-native"]}
